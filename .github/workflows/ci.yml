# Runs scripts/check.sh on a clean machine for every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:            # "Run workflow" button in the Actions tab

permissions:
  contents: read                # CI can read the code, nothing else

concurrency:                    # a newer push cancels the older run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      # actions pinned to exact commits (version in the comment): a re-tagged release
      # can't change what runs here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.11.13"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Lockfile, lint, tests, generated files, secrets
        run: ./scripts/check.sh

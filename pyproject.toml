[project]
name = "vetriever"
version = "0.1.0"
description = "Builds a cited database of veterinary clinical studies from the published literature."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
]

[project.scripts]
vet = "vet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling>=1.27"]   # 1.27 is the first to read license = "MIT"
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests never reach the network: no cost, no keys, no flaky services (vet ping checks those)
addopts = "--disable-socket"

[tool.ruff]
line-length = 100

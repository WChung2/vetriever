# Settings you may change. Secrets (API keys, contact email) go in .env, never here.

[models]
screen = "gemini-3.5-flash-lite"   # title/abstract screening: cheap, many calls
structure = "gemini-3.8-flash"     # reading one document into the tables
review = "gemini-3.8-flash"        # search refinement and checking quotes against rules

[thinking]                          # minimal | low | medium | high
screen = "low"
structure = "low"
review = "medium"

[spending]
cap_usd = 5.00          # hard stop for everything in corpus/spend.csv; raised per phase, with your OK
max_output_tokens = 16384
save_calls = true       # keep every prompt and answer in corpus/calls/ for auditing

# USD per 1M tokens, paid tier, from https://ai.google.dev/gemini-api/docs/pricing
# (checked 2026-10-28). Thinking tokens are billed as output. Paid calls are refused after
# valid_until until someone re-checks the prices and updates this block.
[prices]
valid_until = "2026-12-31"

[prices."gemini-3.8-flash"]
input = 0.75          # Google raises this to 1.50 on 2027-01-01
output = 3.75         # and this to 7.50

[prices."gemini-3.5-flash-lite"]
input = 0.30
output = 2.50
